name: Generate CBOM with cdxgen (v.2 - use docker image instead install it) 

on:
  workflow_dispatch:
    inputs:
      src_repository:
        description: 'Source Repository'
        required: true
        default: ''
      src_branch:
        description: 'Branch'
        required: false
        default: ''
      src_type:
        description: 'Project Type (java, python, dotnet)'
        required: false
        default: 'java'
      img_type:
        description: 'Custom Container Images see https://cdxgen.github.io/cdxgen/#/ADVANCED?id=custom-container-images'
        required: false
        default: 'ghcr.io/cyclonedx/cdxgen:latest'
      
jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.src_repository }}
          ref: ${{ inputs.src_branch }}
      - name: Generate SBOM using cdxgen container
        run: |
          docker run --rm \
            -v "$(pwd)":/app:rw \
            -v /tmp:/tmp \
            -t ${{ inputs.img_type }} \
            -r /app -o /tmp/cbom.json --include-crypto -t ${{ inputs.src_type }} 
      - name: list files
        run: ls -la
      - name: Upload Scan Results
        uses: actions/upload-artifact@v7
        with:
          name: cbom
          path: cbom.json
